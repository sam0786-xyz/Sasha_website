<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="sashaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Rounded Base Badge -->
  <rect width="120" height="120" rx="24" fill="url(#slateGrad)" />
  <rect x="2" y="2" width="116" height="116" rx="22" stroke="url(#sashaGrad)" stroke-width="2" stroke-opacity="0.4" />

  <!-- Architectural Beam Structure / Apex Symbol -->
  <g filter="url(#shadow)">
    <!-- Tower/Crane/Building Struts -->
    <path d="M60 22 L92 82 L76 82 L60 52 L44 82 L28 82 Z" fill="url(#sashaGrad)" />
    <!-- Horizontal Crossbeam -->
    <rect x="36" y="66" width="48" height="6" rx="3" fill="#ffffff" opacity="0.9" />
    <!-- Center Apex Pin -->
    <circle cx="60" cy="38" r="4.5" fill="#ffffff" />
    <circle cx="60" cy="38" r="2.5" fill="#d97706" />
  </g>

  <!-- Base Label -->
  <text x="60" y="104" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" letter-spacing="2">SASHA GC</text>
</svg>

